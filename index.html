<button
    id="letterMakerTrigger"
    class="letter-maker-trigger"
    type="button"
    aria-label="open letter maker"
    title="write a letter"
    hidden
>
    <img
        src="/tmplates/mbox.png"
        alt=""
        aria-hidden="true"
        draggable="false"
    >
</button>

<div
    id="letterMakerOverlay"
    class="letter-maker-overlay"
    hidden
>
    <section
        class="letter-maker-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="letterMakerTitle"
    >
        <div class="letter-maker-header">
            <div>
                <h2 id="letterMakerTitle" class="letter-maker-title">write a letter</h2>
                <div id="letterMakerCount" class="letter-maker-count">01 / 18</div>
            </div>
            <button
                id="letterMakerClose"
                class="letter-maker-close"
                type="button"
                aria-label="close letter maker"
                title="close"
            >×</button>
        </div>

        <div
            id="letterMakerStatus"
            class="letter-maker-status"
            aria-live="polite"
        ></div>

        <div class="letter-maker-stage">
            <button
                id="letterMakerPrev"
                class="letter-maker-nav letter-maker-prev"
                type="button"
                aria-label="previous letter paper"
                title="previous"
            >‹</button>

            <div class="letter-maker-preview-shell">
                <div
                    id="letterMakerPaper"
                    class="letter-maker-paper"
                    data-letter-font="nintendoh"
                    data-letter-size="medium"
                >
                    <img
                        id="letterMakerPreview"
                        class="letter-maker-preview"
                        src="/tmplates/Letter01.png"
                        alt="letter paper 01"
                        draggable="false"
                    >
                    <div
                        id="letterMakerMessageBlock"
                        class="letter-maker-text-block letter-maker-message-block"
                    >
                        <div
                            id="letterMakerMessage"
                            class="letter-maker-message"
                            contenteditable="true"
                            role="textbox"
                            aria-multiline="true"
                            aria-label="letter message"
                            data-placeholder="write your letter..."
                            spellcheck="true"
                        ></div>
                        <button
                            id="letterMakerMessageMove"
                            class="letter-maker-drag-handle"
                            type="button"
                            aria-label="move letter message"
                            title="move"
                        >✥</button>
                    </div>
                    <div
                        id="letterMakerSignatureBlock"
                        class="letter-maker-text-block letter-maker-signature-block"
                    >
                        <div
                            id="letterMakerSignature"
                            class="letter-maker-signature"
                            contenteditable="true"
                            role="textbox"
                            aria-multiline="false"
                            aria-label="letter signature"
                            data-placeholder="signature"
                            spellcheck="true"
                        ></div>
                        <button
                            id="letterMakerSignatureMove"
                            class="letter-maker-drag-handle"
                            type="button"
                            aria-label="move letter signature"
                            title="move"
                        >✥</button>
                    </div>
                </div>
            </div>

            <button
                id="letterMakerNext"
                class="letter-maker-nav letter-maker-next"
                type="button"
                aria-label="next letter paper"
                title="next"
            >›</button>
        </div>

        <div class="letter-maker-controls" aria-label="letter formatting">
            <label class="letter-maker-control letter-maker-font-control">
                <select id="letterMakerFont" aria-label="letter font">
                    <option value="nintendoh">nintendoh</option>
                    <option value="dynapuff">dynapuff</option>
                    <option value="nunito">nunito</option>
                    <option value="sans">sans</option>
                </select>
            </label>

            <div class="letter-maker-control">
                <div class="letter-maker-colours" role="group" aria-label="letter text colour">
                    <button type="button" class="letter-maker-colour is-selected" data-letter-colour="#333238" aria-label="black" aria-pressed="true" style="--letter-colour:#333238"></button>
                    <button type="button" class="letter-maker-colour" data-letter-colour="#4f7fbd" aria-label="blue" aria-pressed="false" style="--letter-colour:#4f7fbd"></button>
                    <button type="button" class="letter-maker-colour" data-letter-colour="#9fc8ea" aria-label="pastel blue" aria-pressed="false" style="--letter-colour:#9fc8ea"></button>
                    <button type="button" class="letter-maker-colour" data-letter-colour="#a8d8b8" aria-label="pastel green" aria-pressed="false" style="--letter-colour:#a8d8b8"></button>
                    <button type="button" class="letter-maker-colour" data-letter-colour="#ee9fbd" aria-label="pastel pink" aria-pressed="false" style="--letter-colour:#ee9fbd"></button>
                    <button type="button" class="letter-maker-colour" data-letter-colour="#b8a5df" aria-label="pastel lavender" aria-pressed="false" style="--letter-colour:#b8a5df"></button>
                </div>
            </div>

            <div class="letter-maker-control">
                <div class="letter-maker-sizes" role="group" aria-label="letter text size">
                    <button type="button" class="letter-maker-size" data-letter-size="small" aria-pressed="false">small</button>
                    <button type="button" class="letter-maker-size is-selected" data-letter-size="medium" aria-pressed="true">medium</button>
                    <button type="button" class="letter-maker-size" data-letter-size="large" aria-pressed="false">large</button>
                </div>
            </div>

            <div class="letter-maker-control">
                <div class="letter-maker-styles" role="group" aria-label="letter text style">
                    <button id="letterMakerBold" type="button" class="letter-maker-style" aria-label="bold" aria-pressed="false"><strong>b</strong></button>
                    <button id="letterMakerItalic" type="button" class="letter-maker-style" aria-label="italic" aria-pressed="false"><em>i</em></button>
                </div>
            </div>

            <div class="letter-maker-control">
                <div class="letter-maker-emojis" role="group" aria-label="insert emoji">
                    <button id="letterMakerEmoji" type="button" class="letter-maker-emoji" aria-label="add emoji">☺️</button>
                </div>
            </div>

            <button
                id="letterMakerSend"
                class="letter-maker-send"
                type="button"
            >send letter</button>
        </div>

        <div
            id="letterMakerEmojiPopover"
            class="letter-maker-emoji-popover"
            hidden
        ></div>

        <div
            id="letterMakerTemplates"
            class="letter-maker-templates"
            aria-label="letter paper choices"
        ></div>

    </section>
</div>
