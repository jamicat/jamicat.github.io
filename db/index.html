<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dashboard</title>
<style>
@font-face{font-family:nunito;src:url('../nunito.ttf') format('truetype');font-display:swap}
:root{color-scheme:dark;font-family:nunito,system-ui,sans-serif;font-size:12px;background:#0d1421;color:#f9dfdd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:25px 15px;background:radial-gradient(circle at 50% 0%,#2a2838 0%,#0d1421 62%)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit;border:1px solid #cfafbc44;background:#f5c5cb12;border-radius:9px;padding:7px 12px}
button:hover,button:focus-visible{background:#edb8d42a;border-color:#d5b4d06b}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{border:1px solid #d7bbcb40;background:#ffffff0d;border-radius:9px;padding:9px;color:#fae4e8;width:100%}
input:focus,textarea:focus,select:focus{outline:1px solid #f1bcd0}
h1,h2,p{margin:0}
h1{font-size:18px;color:#f2bdd0}
h2{font-size:13px;color:#f2c7d7}
p{line-height:1.5;color:#cebccc}
small,.muted{font-size:10px;color:#cbb2c4}
.shell{max-width:1080px;margin:auto;border:1px solid #e3b9c45e;border-radius:21px;padding:17px;background:#322c3a99;box-shadow:0 16px 44px #0005,inset 0 1px #fff1}
.top{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:0 3px 12px;border-bottom:1px solid #d6b6c039}
.login{max-width:360px;margin:70px auto;text-align:center;display:grid;gap:12px}
.login form{display:grid;gap:10px}
.dashboard{margin-top:14px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.tab{text-align:center;padding:10px;min-height:40px;display:grid;place-items:center;gap:4px}
.tab.active{border-color:#edc5d6;background:#d4bac026}
.tab strong{font-size:12px;color:#f5d1dd}
.tab span{font-size:10px;color:#c6b3c6}
.panel{margin-top:12px;border:1px solid #dac2d13c;background:#171b2c73;border-radius:15px;padding:11px}
.panel[hidden],.login[hidden],.dashboard[hidden]{display:none!important}
.panel-top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.panel iframe{width:100%;height:66vh;min-height:450px;border:0;border-radius:11px;background:#101828}
.art-filter{max-width:280px;margin:10px 0}
.art-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:9px}
.art-entry{border:1px solid #e0bac342;border-radius:12px;padding:11px;background:#ecc3ce0d;display:grid;gap:7px}
.art-entry.pending{border-color:#f2d2a377}
.art-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}
.art-entry .name{font-size:11px;color:#f5bfd2;font-weight:bold;overflow-wrap:anywhere}
.art-entry .content{white-space:pre-wrap;overflow-wrap:anywhere;color:#f2e1da;line-height:1.5}
.art-entry .reply{font-size:10px;color:#ddc4d4}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.art-entry textarea{min-height:42px;resize:vertical}
.status{min-height:1em;margin-top:8px;color:#f5d4be}
.logout{font-size:10px;padding:6px 10px}
@media(max-width:560px){body{padding:9px}.shell{padding:12px}.tab{padding:9px;min-height:40px}.tab span{font-size:9px}.panel iframe{min-height:510px;height:70vh}}

.upload-form{display:grid;gap:8px;max-width:720px}
.upload-form label,.upload-card label{display:grid;gap:4px;font-size:10px;color:#d8c9d8}
.upload-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.upload-form textarea,.upload-card textarea{min-height:64px;resize:vertical;white-space:pre-wrap}
.upload-card textarea{min-height:48px}
.upload-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px;margin-top:12px}
.upload-card{display:grid;gap:8px;padding:10px;border:1px solid #dec4d140;border-radius:12px;background:#fff1}
.upload-card img{width:100%;height:112px;object-fit:contain;background:#0d142183;border-radius:8px}
.upload-card .actions button{margin:0}
.upload-status{font-size:10px;min-height:1.1em;color:#ead5e5}
.thumb-tool{display:grid;gap:7px;padding:9px;border:1px solid #e5cbd13b;border-radius:11px;background:#fff1}
.thumb-tool canvas{width:150px;height:141px;max-width:100%;border-radius:6px;background:#303749;object-fit:contain}
.thumb-tool .thumb-options{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.thumb-tool .thumb-options label{display:flex;align-items:center;gap:4px}
.thumb-tool input[type=radio]{width:auto}
.thumb-tool .crop-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.thumb-tool [hidden]{display:none!important}
.thumb-tool input[type=range]{padding:0}
.folder-create{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px;border:1px solid #dec4d140;border-radius:10px;margin-bottom:9px}
.folder-create input{width:min(215px,100%)}
.folder-create button{font-size:10px}
.folder-list{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.folder-list button{font-size:10px;padding:4px 7px}
@media(max-width:560px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.upload-fields,.thumb-tool .crop-controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><h1>dashboard</h1></div><button class="logout" id="logout" type="button" hidden>log out</button></header>
<section class="login" id="login"><h2>log in</h2><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="admin password" required><button type="submit">unlock</button></form><p id="loginStatus" role="status"></p></section>
<section class="dashboard" id="dashboard" hidden>
<nav class="tabs" aria-label="admin sections"><button class="tab active" type="button" data-panel="guestbook"><strong>guestbook</strong></button><button class="tab" type="button" data-panel="playlist"><strong>playlist</strong></button><button class="tab" type="button" data-panel="art"><strong>art comments</strong></button><button class="tab" type="button" data-panel="uploads"><strong>art uploads</strong></button></nav>
<section class="panel" id="panelGuestbook"><div class="panel-top"><h2>guestbook</h2><button type="button" data-reload="guestbook">refresh</button></div><iframe id="frameGuestbook" title="guestbook editor" loading="lazy"></iframe></section>
<section class="panel" id="panelPlaylist" hidden><div class="panel-top"><h2>playlist</h2><button type="button" data-reload="playlist">refresh</button></div><iframe id="framePlaylist" title="playlist editor" loading="lazy"></iframe></section>
<section class="panel" id="panelArt" hidden><div class="panel-top"><h2>art comments</h2><button id="artRefresh" type="button">refresh</button></div><select id="artFilter" class="art-filter" aria-label="filter artworks"><option value="">all artworks</option><option value="sona-teph">jamie & teph</option><option value="sona-feara">jamie & feara</option><option value="kemono-jamie">jamie kemonomimi!!</option><option value="kemono-jp">pen sketch & colouring pencils</option></select><div id="artList" class="art-list" aria-live="polite"></div><p class="status" id="artStatus" role="status"></p></section>
<section class="panel" id="panelUploads" hidden><div class="panel-top"><h2>art uploads</h2><button type="button" id="uploadRefresh">refresh</button></div>
<form id="galleryFolderForm" class="folder-create"><label>new folder<input id="newFolderName" type="text" maxlength="48" placeholder="folder name" required></label><button type="submit">create folder</button><span id="folderStatus" class="upload-status" role="status"></span></form>
<div id="galleryFolderList" class="folder-list"></div>
<form id="galleryUploadForm" class="upload-form">
<div class="upload-fields"><label>image<input name="original" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label><label>folder<select name="group" required><option value="sona">fursona</option><option value="kemono-commissions">kemonomimi</option></select></label></div>
<div class="thumb-tool"><span>thumbnail · 300 × 282</span><div class="thumb-options"><label><input type="radio" name="thumbMode" value="fit" checked> whole image</label><label><input type="radio" name="thumbMode" value="crop"> crop & position</label><label><input type="radio" name="thumbMode" value="manual"> my own thumbnail</label></div>
<div id="cropControls" class="crop-controls" hidden><label>left / right<input type="range" id="cropX" min="0" max="100" value="50"></label><label>up / down<input type="range" id="cropY" min="0" max="100" value="50"></label><label>zoom<input type="range" id="cropZoom" min="1" max="2.5" step="0.05" value="1"></label></div><label id="manualThumbLabel" hidden>your thumbnail<input id="manualThumb" type="file" accept="image/jpeg,image/png,image/webp"></label><canvas id="thumbnailPreview" width="300" height="282" aria-label="thumbnail preview"></canvas></div>
<div class="upload-fields"><label>name<input name="title" type="text" maxlength="100" required placeholder="artwork name"></label><label>artist<input name="artist" type="text" maxlength="100" placeholder="artist name"></label></div>
<label>description<textarea name="caption" rows="3" maxlength="800" placeholder="write a description..."></textarea></label>

<div class="actions"><button type="submit">upload artwork</button></div><p class="upload-status" id="uploadStatus" role="status"></p></form>
<div class="upload-list" id="uploadList"></div><p class="upload-status" id="uploadListStatus" role="status"></p>
</section>
</section>
</div>
<script>
const API = 'https://api.jmeow.co.uk';
const AUTH_KEY = 'jmeow_admin_key';
const login = document.getElementById('login');
const dashboard = document.getElementById('dashboard');
const logout = document.getElementById('logout');
let password = sessionStorage.getItem(AUTH_KEY) || '';
const artNames = {'sona-teph':'jamie & teph','sona-feara':'jamie & feara','kemono-jamie':'jamie kemonomimi!!','kemono-jp':'pen sketch & colouring pencils'};
function openPanel(id){
  for(const name of ['guestbook','playlist','art','uploads']) {
    document.getElementById('panel'+name[0].toUpperCase()+name.slice(1)).hidden = name !== id;
    document.querySelector(`[data-panel="${name}"]`).classList.toggle('active',name===id);
  }
  if (id==='art') refreshArt();
  else if (id==='uploads') refreshUploads();
  else {
    const frame = document.getElementById(id==='guestbook'?'frameGuestbook':'framePlaylist');
    if (!frame.getAttribute('src')) frame.src = id==='guestbook'?'../gb/':'../pl/';
  }
}
function showDashboard(){
  login.hidden=true;dashboard.hidden=false;logout.hidden=false;openPanel('guestbook');
}
async function verify(value){
  const response = await fetch(`${API}/api/admin/unified/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:value}),cache:'no-store'});
  return response.ok && (await response.json()).success === true;
}
document.getElementById('loginForm').addEventListener('submit',async event=>{
  event.preventDefault();
  const button = event.currentTarget.querySelector('button');
  button.disabled=true;
  const status=document.getElementById('loginStatus');
  status.textContent='checking...';
  try {
    const value=document.getElementById('password').value;
    if(!await verify(value)) throw new Error('wrong password or admin secrets are not configured');
    password=value;sessionStorage.setItem(AUTH_KEY,value);document.getElementById('password').value='';status.textContent='';showDashboard();
  } catch(e){status.textContent=e.message||'could not log in';}
  finally{button.disabled=false;}
});
logout.addEventListener('click',()=>{sessionStorage.removeItem(AUTH_KEY);password='';dashboard.hidden=true;login.hidden=false;logout.hidden=true;for(const id of ['frameGuestbook','framePlaylist'])document.getElementById(id).removeAttribute('src');});
document.querySelectorAll('[data-panel]').forEach(button=>button.addEventListener('click',()=>openPanel(button.dataset.panel)));
document.querySelectorAll('[data-reload]').forEach(button=>button.addEventListener('click',()=>{const frame=document.getElementById(button.dataset.reload==='guestbook'?'frameGuestbook':'framePlaylist');frame.contentWindow?.location.reload();}));
const artList=document.getElementById('artList');const artStatus=document.getElementById('artStatus');
function make(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
async function refreshArt(){
  if(!password)return;
  artStatus.textContent='loading...';artList.replaceChildren();
  try{
    const uploadedResponse = await fetch(`${API}/api/admin/gallery`,{headers:{Authorization:`Bearer ${password}`},cache:'no-store'});
    if (uploadedResponse.ok) {
      const uploads = await uploadedResponse.json();
      const filter = document.getElementById('artFilter');
      filter.querySelectorAll('option[data-uploaded]').forEach(option=>option.remove());
      for (const artwork of uploads) {
        artNames[artwork.id] = artwork.title;
        const option = new Option(artwork.title, artwork.id);
        option.dataset.uploaded = 'true';
        filter.append(option);
      }
    }
    const res=await fetch(`${API}/api/admin/art/comments`,{headers:{Authorization:`Bearer ${password}`},cache:'no-store'});
    if(!res.ok)throw new Error('could not load comments');
    const comments=await res.json();const selected=document.getElementById('artFilter').value;
    const visible=comments.filter(c=>!selected||c.art_id===selected);
    if(!visible.length)artList.append(make('p','no notes here yet...'));
    for(const c of visible){
      const card=make('article',undefined,`art-entry ${c.status}`);
      const meta=make('div',undefined,'art-meta');
      meta.append(make('strong',artNames[c.art_id]||c.art_id,'name'),make('small',c.status,'muted'));
      card.append(meta,make('div',c.name,'name'),make('div',c.comment,'content'));
      if(c.reply)card.append(make('div',`jamie replied: ${c.reply}`,'reply'));
      card.append(make('small',new Date(c.created_at).toLocaleString(),'muted'));
      const textarea=make('textarea');textarea.value=c.reply||'';textarea.maxLength=500;textarea.placeholder='write a reply...';card.append(textarea);
      const actions=make('div',undefined,'actions');
      if(c.status==='pending')actions.append(actionButton('approve',c,'approve'));
      actions.append(actionButton('save reply',c,'reply',()=>textarea.value),actionButton('delete',c,'delete'));
      card.append(actions);artList.append(card);
    }
    artStatus.textContent=`${visible.length} ${visible.length===1?'note':'notes'}`;
  }catch(e){artStatus.textContent=e.message||'could not load notes';}
}
function actionButton(label,comment,action,getReply){
  const button=make('button',label);button.type='button';
  button.addEventListener('click',async()=>{
    if(action==='delete'&&!confirm('delete this note?'))return;
    button.disabled=true;artStatus.textContent='saving...';
    try{
      const response=await fetch(`${API}/api/admin/art/comments`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${password}`},body:JSON.stringify({id:comment.id,action,reply:getReply?getReply():undefined})});
      if(!response.ok)throw new Error('could not update note');await refreshArt();
    }catch(e){artStatus.textContent=e.message||'could not save';button.disabled=false;}
  });return button;
}
const uploadForm = document.getElementById('galleryUploadForm');
const uploadList = document.getElementById('uploadList');
const uploadStatus = document.getElementById('uploadStatus');
const uploadListStatus = document.getElementById('uploadListStatus');
let groupChoices = [{value:'sona',label:'fursona'},{value:'kemono-commissions',label:'kemonomimi'}];
let customFolders = [];
const groupSelect = uploadForm.elements.group;
const folderForm = document.getElementById('galleryFolderForm');
const folderStatus = document.getElementById('folderStatus');
const folderList = document.getElementById('galleryFolderList');
async function refreshFolders() {
  const response = await fetch(`${API}/api/gallery/folders`, {cache:'no-store'});
  if (!response.ok) throw new Error('could not load folders');
  const folders = await response.json();
  customFolders = Array.isArray(folders) ? folders : [];
  groupChoices = [{value:'sona',label:'fursona'},{value:'kemono-commissions',label:'kemonomimi'},...customFolders.map(folder=>({value:folder.id,label:folder.name}))];
  const selected = groupSelect.value;
  groupSelect.replaceChildren(...groupChoices.map(item=>new Option(item.label,item.value)));
  if (groupChoices.some(item=>item.value===selected)) groupSelect.value=selected;
  folderList.replaceChildren();
  for(const folder of customFolders) {
    const button=make('button',`${folder.name} ×`);
    button.type='button';button.title='delete empty folder';
    button.addEventListener('click',async()=>{
      if (!confirm(`delete the empty folder ${folder.name}?`)) return;
      try {await galleryAdminRequest('/api/admin/gallery/folders/delete',{id:folder.id});await refreshFolders();folderStatus.textContent='folder deleted';}
      catch(error){folderStatus.textContent=error.message;}
    });
    folderList.append(button);
  }
}
folderForm.addEventListener('submit',async event=>{
  event.preventDefault();const field=document.getElementById('newFolderName');
  folderStatus.textContent='creating...';
  try {const folder=await galleryAdminRequest('/api/admin/gallery/folders/create',{name:field.value.trim()});field.value='';await refreshFolders();groupSelect.value=folder.id;folderStatus.textContent='folder created';}
  catch(error){folderStatus.textContent=error.message;}
});

function uploadField(label, value, kind = 'input') {
  const wrapper = make('label');
  wrapper.append(make('span', label));
  const control = document.createElement(kind);
  if (kind === 'textarea') { control.rows = 2; control.maxLength = 800; }
  else { control.type = 'text'; control.maxLength = 100; }
  control.value = value || '';
  wrapper.append(control);
  return { wrapper, control };
}

async function galleryAdminRequest(path, data) {
  const headers = { Authorization: `Bearer ${password}` };
  if (!(data instanceof FormData)) headers['Content-Type'] = 'application/json';
  const response = await fetch(`${API}${path}`, { method:'POST', headers, body: data instanceof FormData ? data : JSON.stringify(data) });
  const result = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(result.error || 'could not save artwork');
  return result;
}

const thumbCanvas = document.getElementById('thumbnailPreview');
const thumbMode = () => uploadForm.elements.thumbMode.value;
const cropX = document.getElementById('cropX');
const cropY = document.getElementById('cropY');
const cropZoom = document.getElementById('cropZoom');
const manualThumb = document.getElementById('manualThumb');
const thumbCache = new WeakMap();
async function loadThumbImage(file) {
  if (!file) return null;
  if (thumbCache.has(file)) return thumbCache.get(file);
  const promise = new Promise((resolve,reject)=>{
    const image=new Image();
    const url=URL.createObjectURL(file);
    image.onload=()=>{URL.revokeObjectURL(url);resolve(image);};
    image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('could not read image'));};
    image.src=url;
  });
  thumbCache.set(file,promise);
  return promise;
}
async function drawThumbnail() {
  const mode=thumbMode();
  document.getElementById('cropControls').hidden=mode!=='crop';
  document.getElementById('manualThumbLabel').hidden=mode!=='manual';
  const original=uploadForm.elements.original.files?.[0];
  const file=mode==='manual'?manualThumb.files?.[0]:original;
  const context=thumbCanvas.getContext('2d');
  context.fillStyle='#fffaf2';context.fillRect(0,0,300,282);
  if (!file) return;
  const image=await loadThumbImage(file);
  const w=image.naturalWidth,h=image.naturalHeight;
  if (!w || !h) throw new Error('invalid image dimensions');
  if (mode==='crop') {
    const aspect=300/282;
    const baseW=Math.min(w,h*aspect);
    const cropW=baseW/Number(cropZoom.value);
    const cropH=cropW/aspect;
    const x=(w-cropW)*Number(cropX.value)/100;
    const y=(h-cropH)*Number(cropY.value)/100;
    context.drawImage(image,x,y,cropW,cropH,0,0,300,282);
  } else {
    const scale=Math.min(300/w,282/h);
    const drawW=w*scale,drawH=h*scale;
    context.drawImage(image,(300-drawW)/2,(282-drawH)/2,drawW,drawH);
  }
}
async function makeArtworkThumbnail(file) {
  if (thumbMode()==='manual') {
    const manual=manualThumb.files?.[0];
    if (!manual) throw new Error('select your thumbnail image');
    if (manual.size>500000) throw new Error('custom thumbnail must be under 500 kb');
    return manual;
  }
  await drawThumbnail();
  const blob=await new Promise(resolve=>thumbCanvas.toBlob(resolve,'image/jpeg',0.82));
  if (!blob||blob.size>500000) throw new Error('could not make thumbnail');
  return new File([blob],'thumbnail.jpg',{type:'image/jpeg'});
}
for(const input of [uploadForm.elements.original,manualThumb,cropX,cropY,cropZoom,...uploadForm.querySelectorAll('[name=thumbMode]')]) {
  input.addEventListener('input',()=>drawThumbnail().catch(error=>{uploadStatus.textContent=error.message;}));
  input.addEventListener('change',()=>drawThumbnail().catch(error=>{uploadStatus.textContent=error.message;}));
}

async function refreshUploads() {
  if (!password) return;
  try{await refreshFolders();}catch(error){folderStatus.textContent=error.message;}
  uploadListStatus.textContent = 'loading...';
  uploadList.replaceChildren();
  try {
    const response = await fetch(`${API}/api/admin/gallery`,{headers:{Authorization:`Bearer ${password}`},cache:'no-store'});
    if (!response.ok) throw new Error('could not load uploads');
    const entries = await response.json();
    if (!entries.length) uploadList.append(make('p','no uploads yet...'));
    for (const art of entries) {
      const card = make('article',undefined,'upload-card');
      const image = document.createElement('img');
      image.src = art.thumb; image.alt = art.title; image.loading = 'lazy';
      card.append(image);
      const name = uploadField('name',art.title);
      const artist = uploadField('artist',art.artist);
      const caption = uploadField('description',art.caption,'textarea');
      const folder = make('label'); folder.append(make('span','folder'));
      const select = document.createElement('select');
      for (const item of groupChoices) {const opt = new Option(item.label,item.value);select.append(opt);}
      select.value = art.group; folder.append(select);
      card.append(name.wrapper,artist.wrapper,caption.wrapper,folder);
      const actions = make('div',undefined,'actions');
      const save = make('button','save'); save.type='button';
      const remove = make('button','delete');remove.type='button';
      save.addEventListener('click',async()=>{
        save.disabled=true;uploadListStatus.textContent='saving...';
        try{await galleryAdminRequest('/api/admin/gallery/update',{id:art.id,title:name.control.value,artist:artist.control.value,caption:caption.control.value,group:select.value});uploadListStatus.textContent='saved';}
        catch(e){uploadListStatus.textContent=e.message;}
        finally{save.disabled=false;}
      });
      remove.addEventListener('click',async()=>{
        if (!confirm(`delete ${art.title} and its notes?`)) return;
        remove.disabled=true;uploadListStatus.textContent='deleting...';
        try{await galleryAdminRequest('/api/admin/gallery/delete',{id:art.id});await refreshUploads();}
        catch(e){uploadListStatus.textContent=e.message;remove.disabled=false;}
      });
      actions.append(save,remove);card.append(actions);uploadList.append(card);
    }
    uploadListStatus.textContent=`${entries.length} uploaded`;
  }catch(e){uploadListStatus.textContent=e.message||'could not load uploads';}
}

uploadForm.addEventListener('submit',async event=>{
  event.preventDefault();
  const button = uploadForm.querySelector('button[type=submit]');
  const file = uploadForm.elements.original.files?.[0];
  if (!file) return;
  if (file.size>8000000) {uploadStatus.textContent='images must be under 8 mb';return;}
  button.disabled=true;uploadStatus.textContent='making thumbnail...';
  try {
    const thumbnail = await makeArtworkThumbnail(file);
    const data = new FormData(uploadForm);
    data.append('thumbnail',thumbnail);
    uploadStatus.textContent='uploading...';
    await galleryAdminRequest('/api/admin/gallery/upload',data);
    uploadForm.reset();
    await drawThumbnail();
    uploadStatus.textContent='artwork uploaded';
    await refreshUploads();
  }catch(e){uploadStatus.textContent=e.message||'could not upload';}
  finally{button.disabled=false;}
});
document.getElementById('uploadRefresh').addEventListener('click',refreshUploads);

document.getElementById('artRefresh').addEventListener('click',refreshArt);
document.getElementById('artFilter').addEventListener('change',refreshArt);
if(password){verify(password).then(ok=>{if(ok)showDashboard();else{sessionStorage.removeItem(AUTH_KEY);password='';}}).catch(()=>{sessionStorage.removeItem(AUTH_KEY);password='';});}
</script>
