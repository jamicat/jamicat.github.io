<body class="bg-black h-screen w-screen overflow-hidden">
<div
    id="bgndVideo"
    class="watch-party-cinematic"
>
<div id="videoPoster" class="absolute inset-0 bg-black z-0 bg-cover bg-center"></div>
<div id="background-video-iframe" style="opacity: 0; transition: opacity 0.5s;"></div>
</div>

<div id="terminal" class="terminal absolute p-6 max-w-full w-[90vw] sm:w-[480px] rounded-3xl shadow-lg backdrop-blur-xl" style="z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%);">
<div class="drag-area text-pink-600 text-xs mb-2 select-none flex justify-between items-center">
  <span class="flex items-center space-x-3">
    <img
      id="mainAvatar"
      src="acl.png"
      alt="Avatar"
      class="avatar-icon terminal-expanded-only"
    >

    <span
      id="typed3"
      class="terminal-expanded-only theme-heading font-medium text-3xl mt-9 text-white text-2xl mt-4 mb-1 text-blue-glow"
    >
      Jamie
    </span>

    <span
      id="terminalMinimizedLabel"
      class="theme-heading hidden text-xs font-bold tracking-widest text-white text-blue-glow"
    >
      jamie
    </span>
  </span>

 <div class="flex items-center gap-2 mr-3 -mt-12">
  <button
    id="videoToggle"
    type="button"
    class="flex h-4 w-4 items-center justify-center text-red-300 hover:text-cyan-400 transition-colors duration-200 text-lg leading-none"
  >
    <svg
      id="pauseIcon"
      xmlns="http://www.w3.org/2000/svg"
      class="block h-4 w-4 fill-current hidden"
      viewBox="0 0 24 24"
    >
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
    </svg>

    <svg
      id="playIcon"
      xmlns="http://www.w3.org/2000/svg"
      class="block h-4 w-4 fill-current"
      viewBox="0 0 24 24"
    >
      <path d="M8 5v14l11-7z"></path>
    </svg>
  </button>

  <button
    id="nextTrack"
    type="button"
    class="flex h-4 w-4 items-center justify-center text-red-300 hover:text-cyan-400 transition-colors duration-200 text-lg leading-none"
  >
    <svg
      id="nextIcon"
      xmlns="http://www.w3.org/2000/svg"
      class="block h-4 w-4 fill-current"
      viewBox="0 0 24 24"
    >
      <path d="M7 6v12l8.5-6L7 6zm9 0h2v12h-2V6z"></path>
    </svg>
  </button>

  <div class="relative flex h-4 w-4 items-center justify-center">
    <button
      id="changeTheme"
      type="button"
      class="flex mt-1 ml-2 h-4 w-4 items-center justify-center text-red-300 hover:text-cyan-400 transition-colors duration-200 text-lg leading-none"
    >
      <svg
        id="themeIcon"
        class="block h-4 w-4 fill-current"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M5.6 11.6l-1.2-1.2c-0.8-0.2-2-0.1-2.7 1-0.8 1.1-0.3 2.8-1.7 4.6 0 0 3.5 0 4.8-1.3 1.2-1.2 1.2-2.2 1-3l-0.2-0.1z"></path>
        <path d="M5.8 8.1c-0.2 0.3-0.5 0.7-0.7 1 0 0.2-0.1 0.3-0.2 0.4l1.5 1.5c0.1-0.1 0.3-0.2 0.4-0.3 0.3-0.2 0.7-0.4 1-0.7 0.4 0 0.6-0.2 0.8-0.4l-2.2-2.2c-0.2 0.2-0.4 0.4-0.6 0.7z"></path>
        <path d="M15.8 0.2c-0.3-0.3-0.7-0.3-1-0.1 0 0-3 2.5-5.9 5.1-0.4 0.4-0.7 0.7-1.1 1-0.2 0.2-0.4 0.4-0.6 0.5l2.1 2.1c0.2-0.2 0.4-0.4 0.5-0.7 0.3-0.4 0.6-0.7 0.9-1.1 2.5-3 5.1-5.9 5.1-5.9 0.3-0.2 0.3-0.6 0-0.9z"></path>
      </svg>
    </button>

    <div
      id="tooltip"
      class="absolute left-1/2 top-full mt-2 -translate-x-1/2 rounded-3xl bg-transparent text-sm text-white transition-all duration-300 py-2 px-3 flex flex-col gap-1 z-50 shadow-lg backdrop-blur-sm border border-white/5 min-w-[8rem] opacity-0 pointer-events-none invisible"
    >
      <button id="themeStars" class="theme-body text-white text-xs hover:bg-white/10 text-aquag-glow rounded px-2 py-1 transition">pixel cat</button>
      <button id="themeDefault" class="theme-body text-white text-xs hover:bg-white/10 text-aquag-glow rounded px-2 py-1 transition">animal crossing</button>
      <button id="themeCat" class="hidden theme-body text-white text-xs hover:bg-white/10 text-aquag-glow rounded px-2 py-1 transition">starcat</button>
      <button id="themeAero" class="hidden theme-body text-white text-xs hover:bg-white/10 text-aquag-glow rounded px-2 py-1 transition">sky</button>
    </div>
  </div>

  <button
    id="rewind10"
    type="button"
    class="flex h-4 w-4 items-center justify-center text-pink-100 transition-colors duration-200 text-lg leading-none"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="block h-4 w-4 fill-current"
    >
      <path d="M16.948 20.2a1 1 0 0 1-.465-.115l-4.472-2.352-4.471 2.348a1 1 0 0 1-1.451-1.054l.854-4.979-3.619-3.527a1 1 0 0 1 .554-1.706l5-.727 2.237-4.531A1 1 0 0 1 12.011 3a1 1 0 0 1 .9.558l2.236 4.53 5 .727a1 1 0 0 1 .554 1.706l-3.621 3.526.854 4.98a1 1 0 0 1-.986 1.173zM6.171 10.5l2.544 2.479a1 1 0 0 1 .285.888l-.6 3.5 3.144-1.653a.993.993 0 0 1 .931 0l3.144 1.653-.6-3.5a1 1 0 0 1 .288-.885l2.544-2.482-3.515-.511a1 1 0 0 1-.752-.547l-1.573-3.183-1.573 3.186a1 1 0 0 1-.752.547z"></path>
    </svg>
  </button>

  <button
    id="terminalMinimize"
    type="button"
    class="flex h-4 w-4 items-center justify-center text-red-300 hover:text-cyan-400 transition-colors duration-200 text-lg leading-none"
    aria-label="minimize terminal"
    aria-expanded="true"
    title="minimize terminal"
  >
    <svg
      id="terminalMinimizeIcon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="block h-4 w-4 fill-current"
      aria-hidden="true"
    >
      <path d="M5 11h14v2H5z"></path>
    </svg>

    <svg
      id="terminalRestoreIcon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="hidden block h-4 w-4 fill-current"
      aria-hidden="true"
    >
      <path d="M7 7h10v10H7V7zm2 2v6h6V9H9z"></path>
    </svg>
  </button>
</div>

<div id="terminalContent" class="terminal-expanded-only">
<div class="font-medium text-pink-600 mt-5 mb-4 text-center" id="typed"></div>
<div id="buttonRow" class="flex justify-center space-x-4 flex-wrap sm:flex-nowrap">
<button id="aboutButton" class="terminal-button theme-body text-xs" onclick="siteFAQ()">about!</button>
<button class="terminal-button ml-2 theme-body text-xs" onclick="showArt()">art</button>
<button class="terminal-button theme-body text-xs" onclick="showList()">playlist</button>
<button class="terminal-button ml-5 theme-body text-xs" onclick="showGuestBook()">guestbook</button>
</div>
</div>
</div>
<div class="homepage-media-controls">
<div class="volume-wrap">
 <svg
  id="volumeIcon"
  class="volume-icon"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  viewBox="0 0 24 24"
  stroke="currentColor"
>
  <path
    id="speakerBody"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    d="M11 5L6 9H3v6h3l5 4V5z"
  />

  <path
    id="wave1"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    d="M15.5 8.5a5 5 0 010 7"
  />

  <path
    id="wave2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    d="M18 6a8 8 0 010 12"
  />

   <path
  id="muteLine1"
  style="display:none"
  stroke-linecap="round"
  stroke-width="2"
  d="M16 8L21 13"
/>

<path
  id="muteLine2"
  style="display:none"
  stroke-linecap="round"
  stroke-width="2"
  d="M21 8L16 13"
/>
</svg>
  <input
    id="volumeSlider"
    type="range"
    min="0"
    max="100"
    value="50"
 >
</div>

<div
    id="normalProgressWrap"
    class="normal-progress-wrap hidden"
    aria-hidden="true"
>
    <div
    id="normalProgressCurrentTooltip"
    class="
        normal-progress-tooltip
        normal-progress-current-tooltip
    "
    role="tooltip"
>
    0:00
</div>

<div
    id="normalProgressTooltip"
    class="
        normal-progress-tooltip
        normal-progress-hover-tooltip
    "
    role="tooltip"
>
    0:00
</div>

    <input
        id="normalProgressSlider"
        type="range"
        min="0"
        max="100000"
        step="1"
        value="0"
        aria-label="song progress"
    >
</div>
</div>
