<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>playlist</title>

<style>
@font-face{
  font-family:"Nunito";
  src:url("nunito.ttf") format("truetype");
}

body{
  font-family:Nunito,sans-serif;
  background:
    radial-gradient(circle at top,#1b355d 0%,#0b1524 45%,#05080d 100%);
  color:white;
  padding:32px;
}

h2{
  margin-bottom:20px;
  color:#ffffff;
}

#list{
  min-width:0;
}

.card{
  background:rgba(73,132,201,0.10);

  padding:12px;

  border-radius:14px;

  margin-bottom:10px;

  display:flex;
  flex-direction:column;
  gap:8px;

  overflow:hidden;
  box-sizing:border-box;

  border:1px solid rgba(120,199,255,.15);

  transition:.2s;
}

.card:hover{
  border-color:rgba(255,170,72,.35);
  box-shadow:0 0 18px rgba(255,170,72,.12);
}

.card input{
  width:100%;
  box-sizing:border-box;

  padding:8px;

  border-radius:8px;
  border:none;

  background:rgba(255,255,255,.08);
  color:white;

  outline:none;
}

.card input::placeholder{
  color:#9fb7d2;
}

.card input:focus{
  box-shadow:0 0 0 2px rgba(120,199,255,.35);
}

button{
  margin-top:6px;
  padding:8px 10px;

  border-radius:8px;
  border:none;

  cursor:pointer;

  background:linear-gradient(135deg,#ffb15b,#ff8d3a);
  color:#08131f;

  font-family:Nunito,sans-serif;
  font-weight:700;

  transition:.15s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 0 16px rgba(255,160,70,.35);
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.song-number{
  font-size:.8rem;
  color:#9fb7d2;
}

.order-controls{
  display:flex;
  gap:6px;
}

.order-button{
  margin-top:0;
  min-width:38px;
  padding:6px 10px;
}
.order-controls{flex-wrap:wrap;justify-content:flex-end;align-items:center}
.order-jump{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:#a9ddfa}
.card .order-jump input{width:54px;padding:6px;text-align:center;font-size:.8rem;border:1px solid rgba(150,194,237,.25);appearance:textfield;-moz-appearance:textfield}
.order-jump input::-webkit-inner-spin-button,.order-jump input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.order-top{background:rgba(147,212,245,.2);color:#c5eafd;border:1px solid rgba(147,212,245,.24)}
#autoFillAllStatus{font-size:.8rem;color:#a9ddfa;align-self:center}


button:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none !important;
  box-shadow:none !important;
}

.thumbnail-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.thumbnail-toggle{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#d7e7f8;
  font-size:.9rem;
  cursor:pointer;
  user-select:none;
}

.thumbnail-toggle input[type="checkbox"]{
  width:auto;
  margin:0;
  padding:0;
  box-shadow:none;
  accent-color:#ff9d46;
}

.custom-thumbnail-input:disabled,
.youtube-thumbnail-input:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.thumbnail-help{
  margin:0;
  color:#8fa8c4;
  font-size:.78rem;
  line-height:1.35;
}

.controls{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.danger-button{background:rgba(225,104,112,.18);color:#ffb7c2;border:1px solid rgba(255,171,181,.38)}
.import-section{max-width:none;margin-top:18px;padding:15px;border-radius:14px;background:rgba(73,132,201,.09);border:1px solid rgba(120,199,255,.16)}
.import-section label{display:block;font-size:.9rem;font-weight:700;margin-bottom:8px}
.import-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.import-controls input[type=text]{min-width:180px;flex:1;padding:9px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(150,194,237,.25);color:#fff}
.import-section p{font-size:.8rem;color:#a9c3dc;line-height:1.45}
.file-pick{margin:6px 0 0 !important;padding:8px 10px;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,#ffb15b,#ff8d3a);color:#08131f;font-size:.85rem !important}
.pick-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#a9ddfa}
.pick-row input{width:auto;accent-color:#9bdcf8}
.card.is-jamie-pick{border-color:rgba(147,212,245,.48)}
#playlistImportStatus{min-height:1em}
.workspace{display:grid;grid-template-columns:minmax(0,700px) minmax(205px,275px);gap:20px;align-items:start;max-width:1050px}
.editor-pane{min-width:0}
.order-pane{position:sticky;top:22px;min-width:0;border:1px solid rgba(155,210,249,.22);border-radius:15px;padding:13px;background:rgba(73,132,201,.10);box-shadow:0 10px 34px rgba(0,0,0,.12)}
.order-pane h3{margin:0;font-size:.94rem;color:#d6e9fc;font-weight:800}
.order-subtitle{font-size:.73rem;color:#a9c3dc;margin:5px 0 11px;line-height:1.4}
#quickOrderList{display:flex;flex-direction:column;gap:5px;max-height:min(70vh,680px);overflow-y:auto;overscroll-behavior:contain;padding:2px 3px 2px 0;scrollbar-width:thin;scrollbar-color:#86bada transparent}
.quick-order-song{display:flex;align-items:center;gap:7px;min-height:31px;border:1px solid rgba(155,210,249,.17);background:rgba(255,255,255,.045);border-radius:9px;padding:5px 7px;cursor:grab;user-select:none;touch-action:pan-y;transition:background .12s,border-color .12s,opacity .12s}
.quick-order-song:hover{background:rgba(169,221,250,.12);border-color:rgba(169,221,250,.38)}
.quick-order-song:active{cursor:grabbing}
.quick-order-song.dragging{opacity:.32}
.quick-order-song.drop-before{box-shadow:0 -3px 0 #a9ddfa}
.quick-order-song.drop-after{box-shadow:0 3px 0 #a9ddfa}
.quick-order-handle{font-size:13px;letter-spacing:-3px;color:#a9c3dc;flex-shrink:0;margin-right:3px}
.quick-order-number{min-width:19px;font-size:.68rem;color:#a8c9e2;font-variant-numeric:tabular-nums}
.quick-order-title{font-size:.77rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:#e0eafb}
.quick-order-pick{font-size:.7rem;color:#a9ddfa;flex-shrink:0}
.quick-order-empty{font-size:.78rem;color:#a9c3dc;padding:10px 3px}
.order-save{width:100%;margin-top:10px;background:linear-gradient(135deg,#a9ddfa,#c6bef9);color:#15243d}
#quickOrderStatus{min-height:1.1em;font-size:.72rem;color:#c9e4f6;line-height:1.4;margin:8px 0 0}
@media(max-width:760px){body{padding:18px}.workspace{grid-template-columns:minmax(0,1fr)}.order-pane{position:static;grid-row:1}#quickOrderList{max-height:220px}}
</style>
</head>

<body>

<h2>playlist</h2>

<div class="workspace">
<div class="editor-pane">
<div id="list"></div>

<div class="controls">
  <button onclick="addSong()">add song</button>
  <button onclick="save()">save all changes</button>
  <button id="autoFillAllButton" type="button" onclick="autoFillAll()">auto-fill all</button>
  <button onclick="exportPlaylist()" type="button">export backup</button>
  <button onclick="deleteAllSongs()" type="button" class="danger-button">delete all songs</button>
  <span id="autoFillAllStatus" role="status" aria-live="polite"></span>
</div>
<div class="import-section">
  <label for="playlistImportInput">import a playlist</label>
  <div class="import-controls">
    <input id="playlistImportInput" type="text" placeholder="youtube playlist link or video links" autocomplete="off">
    <button type="button" onclick="importFromInput()">import links</button>
    <label class="file-pick" for="playlistImportFile">import json file</label>
    <input id="playlistImportFile" type="file" accept=".json,application/json" onchange="importFromFile(this)" hidden>
  </div>
  <p id="playlistImportStatus" role="status" aria-live="polite"></p>
</div>
</div>
<aside class="order-pane" aria-label="quick song order">
  <h3>quick order</h3>
  <div id="quickOrderList" aria-label="drag to reorder songs"></div>
  <button id="quickOrderSave" class="order-save" type="button" onclick="saveQuickOrder()">save</button>
  <p id="quickOrderStatus" role="status" aria-live="polite"></p>
</aside>
</div>

<script>
const API = "https://api.jmeow.co.uk";
const ADMIN_KEY = prompt("enter password");

if (!ADMIN_KEY) {
  document.body.innerHTML = "unauthorized";
  throw new Error("unauthorized");
}

let playlist = [];

function escapeAttribute(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function extractYouTubeVideoId(value) {
  const input = String(value ?? "").trim();

  if (!input) return "";

  if (/^[A-Za-z0-9_-]{11}$/.test(input)) {
    return input;
  }

  let candidate = input;

  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(candidate)) {
    candidate = `https://${candidate}`;
  }

  let url;

  try {
    url = new URL(candidate);
  } catch {
    return input;
  }

  const host = url.hostname
    .toLowerCase()
    .replace(/^www\./, "")
    .replace(/^m\./, "")
    .replace(/^music\./, "");

  let videoId = "";

  if (host === "youtu.be") {
    videoId = url.pathname
      .split("/")
      .filter(Boolean)[0] || "";
  } else if (
    host === "youtube.com" ||
    host.endsWith(".youtube.com") ||
    host === "youtube-nocookie.com" ||
    host.endsWith(".youtube-nocookie.com")
  ) {
    videoId =
      url.searchParams.get("v") ||
      url.searchParams.get("vi") ||
      "";

    if (!videoId) {
      const parts = url.pathname
        .split("/")
        .filter(Boolean);

      if (
        ["shorts", "embed", "live", "v"].includes(parts[0]) &&
        parts[1]
      ) {
        videoId = parts[1];
      }
    }

    if (!videoId) {
      const nested =
        url.searchParams.get("u") ||
        url.searchParams.get("q") ||
        url.searchParams.get("url");

      if (nested) {
        const decoded = (() => {
          try {
            return decodeURIComponent(nested);
          } catch {
            return nested;
          }
        })();

        const nestedValue =
          decoded.startsWith("/")
            ? `https://youtube.com${decoded}`
            : decoded;

        const nestedId =
          extractYouTubeVideoId(nestedValue);

        if (/^[A-Za-z0-9_-]{11}$/.test(nestedId)) {
          videoId = nestedId;
        }
      }
    }
  }

  videoId = String(videoId)
    .split(/[?&#/]/)[0]
    .trim();

  return /^[A-Za-z0-9_-]{11}$/.test(videoId)
    ? videoId
    : input;
}

function updateVideoId(i, input) {
  playlist[i].videoId = input.value;
  renderQuickOrder();
}

function updateYouTubeThumbnailSource(i, input) {
  playlist[i].youtubeThumbnailSource =
    input.value;
}

async function fetchMeta(videoId) {
  if (!videoId) return null;

  const res = await fetch(`${API}/api/youtube/meta?id=${videoId}`);

  if (!res.ok) return null;

  return await res.json();
}

async function load() {
  const res = await fetch(`${API}/api/playlist`);
  const result = await res.json();

  playlist = Array.isArray(result)
    ? result.map(song => ({
        ...song,
        customThumbnailEnabled:
          song?.customThumbnailEnabled === true,
        customThumbnailUrl:
          typeof song?.customThumbnailUrl === "string"
            ? song.customThumbnailUrl
            : "",
        youtubeThumbnailEnabled:
          song?.youtubeThumbnailEnabled === true,
        youtubeThumbnailSource:
          typeof song?.youtubeThumbnailSource === "string"
            ? song.youtubeThumbnailSource
            : "",
        jamiePick: song?.jamiePick === true
      }))
    : [];

  render();
}

async function autoFill(i) {
  const videoId =
    extractYouTubeVideoId(
      playlist[i].videoId
    );

  const meta = await fetchMeta(videoId);

  if (!meta) return;

  playlist[i].title = meta.title;
  playlist[i].channelAvatar = meta.avatar;
  playlist[i].channelUrl = meta.channelUrl;

  render();
}

async function autoFillAll() {
  const button = document.getElementById("autoFillAllButton");
  const status = document.getElementById("autoFillAllStatus");
  if (button.disabled) return;
  const eligible = playlist.map((song, index) => ({ song, index, id: extractYouTubeVideoId(song.videoId) }))
    .filter(item => /^[A-Za-z0-9_-]{11}$/.test(item.id));
  if (!eligible.length) {
    status.textContent = "no valid video ids to fill ♡";
    return;
  }
  button.disabled = true;
  let next = 0;
  let done = 0;
  let filled = 0;
  const worker = async () => {
    while (next < eligible.length) {
      const item = eligible[next++];
      try {
        const meta = await fetchMeta(item.id);
        if (meta) {
          item.song.title = meta.title || item.song.title;
          item.song.channelAvatar = meta.avatar || item.song.channelAvatar;
          item.song.channelUrl = meta.channelUrl || item.song.channelUrl;
          filled++;
        }
      } catch {}
      done++;
      status.textContent = `filling little details… ${done}/${eligible.length} ♡`;
    }
  };
  status.textContent = `filling details… 0/${eligible.length}`;
  try {
    await Promise.all(Array.from({ length: Math.min(3, eligible.length) }, () => worker()));
    render();
    status.textContent = `done! ${filled}/${eligible.length} songs filled ♡ press save to publish`;
  } finally {
    button.disabled = false;
  }
}

function moveSongToPosition(i, input) {
  const position = Number(input.value);
  if (!Number.isInteger(position) || position < 1 || position > playlist.length) {
    input.value = String(i + 1);
    return;
  }
  if (position === i + 1) return;
  const [song] = playlist.splice(i, 1);
  playlist.splice(position - 1, 0, song);
  render();
}

function moveSongToTop(i) {
  if (i <= 0) return;
  const [song] = playlist.splice(i, 1);
  playlist.unshift(song);
  render();
}

function moveSong(i, direction) {
  const nextIndex = i + direction;

  if (
    nextIndex < 0 ||
    nextIndex >= playlist.length
  ) {
    return;
  }

  const [song] = playlist.splice(i, 1);
  playlist.splice(nextIndex, 0, song);

  render();
}

function setCustomThumbnailEnabled(i, checkbox) {
  playlist[i].customThumbnailEnabled =
    checkbox.checked;

  if (checkbox.checked) {
    playlist[i].youtubeThumbnailEnabled = false;
  }

  render();
}

function setYouTubeThumbnailEnabled(i, checkbox) {
  playlist[i].youtubeThumbnailEnabled =
    checkbox.checked;

  if (checkbox.checked) {
    playlist[i].customThumbnailEnabled = false;
  }

  render();
}

function render() {
  const el = document.getElementById("list");
  el.innerHTML = "";

  playlist.forEach((song, i) => {
    const div = document.createElement("div");
    div.className = "card";
    div.classList.toggle("is-jamie-pick", song.jamiePick === true);

    const customThumbnailEnabled =
      song.customThumbnailEnabled === true;

    const youtubeThumbnailEnabled =
      song.youtubeThumbnailEnabled === true;

    div.innerHTML = `
      <div class="card-head">
        <span class="song-number">#${i + 1}</span>

        <div class="order-controls">
          <button
            class="order-button"
            type="button"
            onclick="moveSong(${i}, -1)"
            ${i === 0 ? "disabled" : ""}
            aria-label="move song up"
            title="move up"
          >↑</button>

          <button
            class="order-button"
            type="button"
            onclick="moveSong(${i}, 1)"
            ${i === playlist.length - 1 ? "disabled" : ""}
            aria-label="move song down"
            title="move down"
          >↓</button>
          <button
            class="order-button order-top"
            type="button"
            onclick="moveSongToTop(${i})"
            ${i === 0 ? "disabled" : ""}
            aria-label="move song to top"
            title="move to top"
          >⇧ top</button>
          <label class="order-jump" title="move to playlist position">
            #<input type="number" min="1" max="${playlist.length}" step="1" value="${i + 1}"
              aria-label="move song to position" onchange="moveSongToPosition(${i}, this)" onkeydown="if(event.key==='Enter')this.blur()">
          </label>
        </div>
      </div>

      <label class="pick-row" title="shown to everyone, separate from their personal favourites">
        <input type="checkbox" ${song.jamiePick === true ? "checked" : ""} onchange="setJamiePick(${i}, this.checked)">
        ✧♥ jamie's pick
      </label>

      <input
        value="${escapeAttribute(song.videoId)}"
        oninput="updateVideoId(${i}, this)"
        placeholder="youtube url or video id"
      >

      <button
        type="button"
        onclick="autoFill(${i})"
      >auto-fill</button>

      <input
        value="${escapeAttribute(song.title)}"
        oninput="playlist[${i}].title=this.value; renderQuickOrder()"
        placeholder="title"
      >

      <input
        value="${escapeAttribute(song.channelAvatar)}"
        oninput="playlist[${i}].channelAvatar=this.value"
        placeholder="avatar"
      >

      <input
        value="${escapeAttribute(song.channelUrl)}"
        oninput="playlist[${i}].channelUrl=this.value"
        placeholder="channel url"
      >

      <div class="thumbnail-row">
        <label class="thumbnail-toggle">
          <input
            type="checkbox"
            ${customThumbnailEnabled ? "checked" : ""}
            onchange="setCustomThumbnailEnabled(${i}, this)"
          >
          use custom image url
        </label>

        <label class="thumbnail-toggle">
          <input
            type="checkbox"
            ${youtubeThumbnailEnabled ? "checked" : ""}
            onchange="setYouTubeThumbnailEnabled(${i}, this)"
          >
          use another youtube video's thumbnail
        </label>
      </div>

      <input
        class="custom-thumbnail-input"
        type="url"
        value="${escapeAttribute(song.customThumbnailUrl)}"
        oninput="playlist[${i}].customThumbnailUrl=this.value"
        placeholder="custom thumbnail image URL"
        ${customThumbnailEnabled ? "" : "disabled"}
      >

      <input
        class="youtube-thumbnail-input"
        type="text"
        value="${escapeAttribute(song.youtubeThumbnailSource)}"
        oninput="updateYouTubeThumbnailSource(${i}, this)"
        placeholder="youtube video url (or video id) to borrow thumbnail from"
        ${youtubeThumbnailEnabled ? "" : "disabled"}
      >
      
      <button
        type="button"
        onclick="remove(${i})"
      >remove</button>
    `;

    el.appendChild(div);
  });
  renderQuickOrder();
}

let draggedOrderIndex = null;

function orderSongLabel(song) {
  return String(song.title || song.videoId || "untitled tune").trim() || "untitled tune";
}

function clearOrderDropMarkers() {
  document.querySelectorAll("#quickOrderList .quick-order-song").forEach(row => {
    row.classList.remove("drop-before", "drop-after");
  });
}

function renderQuickOrder() {
  const el = document.getElementById("quickOrderList");
  if (!el) return;
  el.replaceChildren();
  if (!playlist.length) {
    const empty = document.createElement("span");
    empty.className = "quick-order-empty";
    empty.textContent = "no little tunes yet ♡";
    el.appendChild(empty);
    return;
  }
  playlist.forEach((song, index) => {
    const row = document.createElement("div");
    row.className = "quick-order-song";
    row.draggable = true;
    row.dataset.index = String(index);
    row.title = orderSongLabel(song);
    row.setAttribute("aria-label", `drag song ${index + 1}: ${orderSongLabel(song)}`);
    const handle = document.createElement("span");
    handle.className = "quick-order-handle";
    handle.textContent = "⠿";
    handle.setAttribute("aria-hidden", "true");
    const number = document.createElement("span");
    number.className = "quick-order-number";
    number.textContent = `${index + 1}.`;
    const title = document.createElement("span");
    title.className = "quick-order-title";
    title.textContent = orderSongLabel(song);
    row.append(handle, number, title);
    if (song.jamiePick === true) {
      const pick = document.createElement("span");
      pick.className = "quick-order-pick";
      pick.textContent = "✧♥";
      pick.title = "jamie's pick";
      row.appendChild(pick);
    }
    row.addEventListener("dragstart", event => {
      draggedOrderIndex = index;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", String(index));
      requestAnimationFrame(() => row.classList.add("dragging"));
    });
    row.addEventListener("dragover", event => {
      if (draggedOrderIndex === null) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      clearOrderDropMarkers();
      row.classList.add(event.clientY < row.getBoundingClientRect().top + row.offsetHeight / 2 ? "drop-before" : "drop-after");
    });
    row.addEventListener("drop", event => {
      event.preventDefault();
      if (draggedOrderIndex === null) return;
      const source = draggedOrderIndex;
      const target = index;
      const after = event.clientY >= row.getBoundingClientRect().top + row.offsetHeight / 2;
      draggedOrderIndex = null;
      clearOrderDropMarkers();
      const insertionIndex = target + (after ? 1 : 0) - (source < target + (after ? 1 : 0) ? 1 : 0);
      if (source === insertionIndex) return;
      const [song] = playlist.splice(source, 1);
      playlist.splice(insertionIndex, 0, song);
      render();
      document.getElementById("quickOrderStatus").textContent = "new order ready ♡ press save order to publish";
    });
    row.addEventListener("dragend", () => {
      draggedOrderIndex = null;
      clearOrderDropMarkers();
      row.classList.remove("dragging");
    });
    el.appendChild(row);
  });
}

async function saveQuickOrder() {
  const button = document.getElementById("quickOrderSave");
  const status = document.getElementById("quickOrderStatus");
  if (button.disabled) return;
  button.disabled = true;
  status.textContent = "saving the new order… ♡";
  try {
    const res = await fetch(`${API}/api/playlist`, { cache: "no-store" });
    if (!res.ok) throw new Error(`couldn't load published songs (${res.status})`);
    const published = await res.json();
    if (!Array.isArray(published)) throw new Error("couldn't read the published playlist");
    const identity = song => extractYouTubeVideoId(song.videoId);
    const counts = new Map();
    const localIds = playlist.map(identity);
    for (const id of localIds) counts.set(id, (counts.get(id) || 0) + 1);
    for (const song of published) {
      const id = identity(song);
      if (!counts.get(id)) throw new Error("songs were added, removed or changed. save all changes first, then save order");
      counts.set(id, counts.get(id) - 1);
    }
    if (published.length !== playlist.length || [...counts.values()].some(n => n !== 0)) {
      throw new Error("songs were added, removed or changed. save all changes first, then save order");
    }
    const groups = new Map();
    for (const song of published) {
      const id = identity(song);
      if (!groups.has(id)) groups.set(id, []);
      groups.get(id).push(song);
    }
    const orderedPublished = localIds.map(id => groups.get(id).shift());
    const saveRes = await fetch(`${API}/api/playlist/update?key=${encodeURIComponent(ADMIN_KEY)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(orderedPublished)
    });
    if (!saveRes.ok) throw new Error(`couldn't save order (${saveRes.status})`);
    status.textContent = "order saved";
  } catch (error) {
    status.textContent = error.message || "couldn't save the order;
  } finally {
    button.disabled = false;
  }
}

function addSong() {
  playlist.push({
    videoId: "",
    title: "",
    channelAvatar: "",
    channelUrl: "",
    customThumbnailEnabled: false,
    customThumbnailUrl: "",
    youtubeThumbnailEnabled: false,
    youtubeThumbnailSource: "",
    jamiePick: false
  });

  render();
}

function remove(i) {
  playlist.splice(i, 1);
  render();
}

function setJamiePick(i, checked) {
  if (!playlist[i]) return;
  playlist[i].jamiePick = checked;
  document.querySelectorAll("#list .card")[i]?.classList.toggle("is-jamie-pick", checked);
  renderQuickOrder();
}

function createImportedSong(value) {
  if (typeof value === "string") value = { videoId: value };
  if (!value || typeof value !== "object") return null;
  const videoId = extractYouTubeVideoId(value.videoId || value.url || "");
  if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) return null;
  return {
    videoId,
    title: typeof value.title === "string" ? value.title.slice(0, 250) : "",
    channelAvatar: typeof value.channelAvatar === "string" ? value.channelAvatar : "",
    channelUrl: typeof value.channelUrl === "string" ? value.channelUrl : "",
    customThumbnailEnabled: value.customThumbnailEnabled === true,
    customThumbnailUrl: typeof value.customThumbnailUrl === "string" ? value.customThumbnailUrl : "",
    youtubeThumbnailEnabled: value.youtubeThumbnailEnabled === true,
    youtubeThumbnailSource: typeof value.youtubeThumbnailSource === "string" ? value.youtubeThumbnailSource : "",
    jamiePick: value.jamiePick === true
  };
}

function appendImportedSongs(items) {
  const existing = new Set(playlist.map(song => extractYouTubeVideoId(song.videoId)));
  let added = 0;
  for (const item of items) {
    const song = createImportedSong(item);
    if (!song || existing.has(song.videoId)) continue;
    playlist.push(song);
    existing.add(song.videoId);
    added++;
  }
  render();
  document.getElementById("playlistImportStatus").textContent = `${added} song${added === 1 ? "" : "s"} added. press save to publish.`;
}

async function importFromInput() {
  const input = document.getElementById("playlistImportInput");
  const value = input.value.trim();
  if (!value) return;
  const status = document.getElementById("playlistImportStatus");
  let playlistUrl;
  try {
    const url = new URL(value);
    if (/^(www\.|m\.|music\.)?(youtube\.com|youtu\.be)$/i.test(url.hostname) && url.searchParams.has("list") && !/[\s,]/.test(value)) playlistUrl = value;
  } catch {}
  if (playlistUrl) {
    status.textContent = "fetching little tunes…";
    try {
      const res = await fetch(`${API}/api/playlist/import?key=${encodeURIComponent(ADMIN_KEY)}&url=${encodeURIComponent(playlistUrl)}`);
      if (!res.ok) throw new Error(res.status === 404 ? "the worker import endpoint is not deployed yet" : `import failed (${res.status})`);
      const data = await res.json();
      appendImportedSongs(Array.isArray(data) ? data : data.videos || []);
    } catch (error) {
      status.textContent = error.message;
    }
    return;
  }
  const items = value.split(/[\s,]+/).filter(Boolean);
  appendImportedSongs(items);
}

async function importFromFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const items = Array.isArray(data) ? data : data.playlist;
    if (!Array.isArray(items)) throw new Error("please choose a playlist json array");
    appendImportedSongs(items);
  } catch (error) {
    document.getElementById("playlistImportStatus").textContent = error.message;
  }
  input.value = "";
}

function exportPlaylist() {
  const blob = new Blob([JSON.stringify(playlist, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = "jmeow-playlist-backup.json";
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function deleteAllSongs() {
  if (!playlist.length) return;
  if (!confirm(`remove all ${playlist.length} songs from the editor? this isn't published until you press save.`)) return;
  playlist = [];
  render();
  document.getElementById("playlistImportStatus").textContent = "all songs removed from editor. press save to publish or reload to undo.";
}

async function save() {
  const payload = playlist.map(song => ({
    ...song,
    videoId:
      extractYouTubeVideoId(song.videoId),
    youtubeThumbnailSource:
      extractYouTubeVideoId(
        song.youtubeThumbnailSource
      )
  }));

  const res = await fetch(`${API}/api/playlist/update?key=${ADMIN_KEY}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  if (res.status === 403) {
    document.body.innerHTML = "unauthorized";
    throw new Error("unauthorized");
  }

  if (!res.ok) {
    alert(`save failed (${res.status})`);
    return;
  }

  alert("saved");
}

load();
</script>
