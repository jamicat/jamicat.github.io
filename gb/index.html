<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>guestbook</title><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@font-face{
  font-family:"Nunito";
  src:url("../nunito.ttf") format("truetype");
}

body{
  font-family:"Nunito",sans-serif;
  background:
    radial-gradient(circle at top,#1b355d 0%,#0b1524 45%,#05080d 100%);
  color:white;
  padding:12px; font-size:12px;
}

h2{
  font-weight:600;
  margin-bottom:12px;
  color:#ffffff;
}

h3{
  margin-top:18px;
  color:#78c7ff;
}

.section{
  max-width:700px;
}

.comment{
  margin-bottom:15px;
  padding:10px;
  border-radius:16px;

  background:rgba(73,132,201,0.10);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(120,199,255,0.15);

  transition:0.2s;
}

.comment:hover{
  transform:translateY(-1px);
  border-color:rgba(255,170,72,0.35);
  box-shadow:0 0 18px rgba(255,170,72,0.12);
}

.name{
  font-weight:600;
  color:#ffffff;
}

.text{
  margin-top:4px;
  color:#b9deff;
  overflow-wrap:anywhere;
}

.time{
  font-size:10px;
  opacity:.7;
  color:#ffb15b;
}

button{
  margin-top:10px;
  margin-right:6px;
  padding:5px 9px; font-size:11px;

  border-radius:8px;
  border:none;

  cursor:pointer;

  background:linear-gradient(135deg,#ffb15b,#ff8d3a);
  color:#08131f;

  font-family:"Nunito",sans-serif;
  font-weight:700;

  transition:.15s;
}

button:hover{
  transform:scale(1.04);
  box-shadow:0 0 16px rgba(255,160,70,.35);
}

textarea{
  background:rgba(255,255,255,.08);
  color:white;
}

textarea::placeholder{
  color:#9fb7d2;
}

:root{color-scheme:dark;--ink:#f5dce0;--muted:#d9b9b5;--accent:#efb4cb;--warm:#e3bd91;--line:rgba(255,220,198,.21);--glass:rgba(104,69,58,.57)}
*{box-sizing:border-box}
html{min-height:100%;background:#0d1421}
body{margin:0;min-height:100vh;padding:17px 18px 25px;font-size:11px;line-height:1.45;color:var(--ink);background:radial-gradient(ellipse at 46% -17%,rgba(159,111,90,.25),transparent 55%),radial-gradient(circle at 94% 93%,rgba(210,142,169,.07),transparent 34%),#0d1421}
.section{width:100%;max-width:740px;margin:0 auto}
h2{max-width:740px;margin:0 auto 12px;font-size:16px;font-weight:800;color:#f0bacd;letter-spacing:.01em}
h3{margin:14px 0 7px;font-size:12px;font-weight:800;color:#f5c9cf}
#pending,#approved{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:8px;align-items:start}
.comment{margin:0;padding:10px 11px;border-radius:14px;border:1px solid var(--line);background:radial-gradient(circle at 15% 0%,rgba(255,233,211,.08),transparent 65%),var(--glass);box-shadow:0 7px 19px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,245,231,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .16s ease,background-color .16s ease,transform .16s ease}
.comment:hover{transform:translateY(-1px);border-color:rgba(244,190,201,.43);box-shadow:0 7px 19px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,245,231,.08)}
.name{font-size:12px;color:#f6c7d8;font-weight:800}
.text{margin-top:3px;font-size:11px;line-height:1.5;color:#f1d7d1}
.time{font-size:9px;color:#bbaaa6;opacity:1}
button{margin:7px 4px 0 0;padding:4px 9px;min-height:25px;font-size:10px;border:1px solid rgba(250,204,217,.23);border-radius:8px;color:#f4cfda;background:rgba(241,186,201,.10);font-family:inherit;font-weight:800;box-shadow:none;transition:background .16s ease,border-color .16s ease,transform .16s ease}
button:hover{transform:translateY(-1px);background:rgba(244,190,208,.18);border-color:rgba(248,211,221,.42);box-shadow:none}
button:focus-visible,textarea:focus-visible{outline:2px solid rgba(245,196,215,.66);outline-offset:2px}
textarea{max-width:100%;font:inherit;font-size:11px;color:#f4dce1;background:rgba(49,33,34,.27);border:1px solid rgba(250,214,203,.20) !important;border-radius:9px !important;resize:vertical}
textarea::placeholder{color:#c7a9ac}
@media(max-width:510px){body{padding:12px 10px 20px}#pending,#approved{grid-template-columns:1fr}.comment{padding:9px 10px}}
@media(prefers-reduced-motion:reduce){.comment,button{transition:none}.comment:hover,button:hover{transform:none}}

</style>
</head>
<body>
<h2>guestbook</h2>
<div class="section">
<h3>pending</h3>
<div id="pending"></div>
<h3>comments</h3>
<div id="approved"></div>

</div>
  
<script>
const API = "https://api.jmeow.co.uk";
const ADMIN_KEY = sessionStorage.getItem("jmeow_admin_key") || prompt("enter password")

if(!ADMIN_KEY){
  document.body.innerHTML="unauthorized"
  throw new Error("Unauthorized")
}

function escapeAdminText(value){return String(value ?? "").replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}

async function verify(){

  const res = await fetch(`${API}/api/pending?key=${ADMIN_KEY}`)

  if(res.status===403){
    document.body.innerHTML="unauthorized"
    throw new Error("Unauthorized")
  }

  loadPending()
  loadApproved()
}

async function loadPending(){

  const res = await fetch(`${API}/api/pending?key=${ADMIN_KEY}`)
  const comments = await res.json()

  const container = document.getElementById("pending")
  container.innerHTML=""

  comments.forEach(c=>{

    const div=document.createElement("div")
    div.className="comment"

    div.innerHTML=`
      <div style="overflow-wrap:anywhere; word-break:break-word;" class="name">${escapeAdminText(c.name)}</div>
      <div class="text">${escapeAdminText(c.comment)}</div>
      <br><div class="time">${escapeAdminText(c.timestamp)}</div>
      <button onclick="approve(${c.id})">approve</button>
      <button onclick="deletePending(${c.id})">delete</button>
    `

    container.appendChild(div)

  })
}

async function loadApproved(){

  const res = await fetch(`${API}/api/list`)
  const data = await res.json()

  const container=document.getElementById("approved")
  container.innerHTML=""

  data.comments.forEach(c=>{

    const div=document.createElement("div")
    div.className="comment"

    div.innerHTML=`
  <div style="overflow-wrap:anywhere; word-break:break-word;" class="name">${escapeAdminText(c.name)}</div>

  <div class="text">${escapeAdminText(c.comment)}</div>

 ${
  c.reply
    ? `
     

    <div style="
      color:#b9deff;
      overflow-wrap:anywhere;
      word-break:break-word;
    ">
      <strong>jamie replied:</strong> ${escapeAdminText(c.reply)}
      <br>
      <button onclick="deleteReply(${c.id})" style="margin-top:6px;">delete reply</button>
    </div>
    `
    : ''
}

  <br><div class="time">${escapeAdminText(c.timestamp)}</div>

  <button onclick="toggleReplyBox(${c.id})">reply</button>
  <button onclick="deleteApproved(${c.id})">delete</button>

  <div id="replyBox-${c.id}" style="display:none; margin-top:10px;">
    <textarea id="replyInput-${c.id}"
      placeholder="write reply..."
      style="width:100%; padding:8px; border-radius:8px; border:none; margin-bottom:6px;"
    >${escapeAdminText(c.reply || "")}</textarea>

    <button onclick="submitReply(${c.id})">send</button>
  </div>
`

    container.appendChild(div)

  })
}

async function approve(id){

  await fetch(`${API}/api/approve/${id}?key=${ADMIN_KEY}`)
  loadPending()
  loadApproved()

}

async function deletePending(id){

 await fetch(`${API}/api/deletePending/${id}?key=${ADMIN_KEY}`)
  loadPending()

}

async function deleteApproved(id){

  await fetch(`${API}/api/delete/${id}?key=${ADMIN_KEY}`)
  loadApproved()

}

  function toggleReplyBox(id){
  const box = document.getElementById(`replyBox-${id}`)
  if(!box) return

  box.style.display = box.style.display === "none" ? "block" : "none"
}


async function deleteReply(id){

  if(!confirm("delete this reply?")) return

  await fetch(`${API}/api/reply/${id}?key=${ADMIN_KEY}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ reply: "" }) // clears it
  })

  loadApproved()
}
  
async function submitReply(id){

  const input = document.getElementById(`replyInput-${id}`)
  if(!input) return

  const reply = input.value.trim()

  if(!reply){
    alert("write something!")
    return
  }

  await fetch(`${API}/api/reply/${id}?key=${ADMIN_KEY}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ reply })
  })

  loadApproved()
}

verify()
</script>
</body>
</html>
